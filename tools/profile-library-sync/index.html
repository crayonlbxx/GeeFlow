<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>GeeFlow profile library</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #201b18; background: #f5f2ee; }
    body { max-width: 900px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .muted { color: #6f6660; }
    .toolbar, .card { border: 1px solid #ded7d0; border-radius: 14px; background: #fffdfa; }
    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px; margin: 20px 0; }
    input, button { font: inherit; border-radius: 9px; padding: 10px 12px; }
    input { min-width: 0; border: 1px solid #cfc5bc; background: white; color: inherit; }
    button { border: 0; background: #3e3028; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #search { grid-column: 1 / -1; }
    #status { min-height: 1.5em; grid-column: 1 / -1; }
    #profiles { display: grid; gap: 10px; }
    .card { padding: 16px; }
    .card h2 { margin: 0; font-size: 1.08rem; }
    .card p { margin: 8px 0 0; white-space: pre-wrap; }
    .meta { margin-top: 10px; font-size: .9rem; }
    @media (prefers-color-scheme: dark) {
      :root { color: #eee8e2; background: #181513; }
      .toolbar, .card { background: #24201d; border-color: #49413a; }
      input { background: #181513; border-color: #625850; }
      .muted { color: #b2a79f; }
      button { background: #d5b69d; color: #201b18; }
    }
  </style>
</head>
<body>
  <header>
    <h1>GeeFlow profile library</h1>
    <p><a href="./decent-editor.html">Decent recipe editor</a></p>
    <div class="muted">Private library. Catalog changes sync to GeeFlow devices.</div>
  </header>
  <section class="toolbar" aria-label="Library access">
    <input id="token" type="password" autocomplete="off" placeholder="Bearer token" aria-label="Bearer token">
    <button id="load">Load library</button>
    <input id="search" type="search" placeholder="Search profiles" aria-label="Search profiles" hidden>
    <div id="status" class="muted" role="status"></div>
  </section>
  <main id="profiles"></main>
  <script>
    const tokenInput = document.querySelector("#token");
    const loadButton = document.querySelector("#load");
    const searchInput = document.querySelector("#search");
    const statusNode = document.querySelector("#status");
    const profilesNode = document.querySelector("#profiles");
    let records = [];

    function render() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      profilesNode.replaceChildren();
      const matches = records.filter(item => !item.deleted &&
        `${item.profile.name} ${item.profile.description}`.toLocaleLowerCase().includes(query));
      if (!matches.length) {
        profilesNode.textContent = "No matching profiles.";
        return;
      }
      for (const item of matches) {
        const card = document.createElement("article");
        card.className = "card";
        const title = document.createElement("h2");
        title.textContent = `${item.favorite ? "★ " : ""}${item.profile.name}`;
        const description = document.createElement("p");
        description.textContent = item.profile.description;
        const meta = document.createElement("div");
        meta.className = "muted meta";
        const program = item.profile.program;
        const count = program.phases?.length ?? program.recording?.samples?.length ?? 0;
        meta.textContent = `${program.phases ? `${count} phases` : `${count} recorded samples`} · item revision ${item.revision}`;
        card.append(title, description, meta);
        profilesNode.append(card);
      }
    }

    loadButton.addEventListener("click", async () => {
      const token = tokenInput.value.trim();
      if (!token) { statusNode.textContent = "Enter the library token."; return; }
      loadButton.disabled = true;
      statusNode.textContent = "Loading…";
      try {
        const response = await fetch("/profile-library/api/v1/catalog", {
          headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
          cache: "no-store",
        });
        if (!response.ok) throw new Error(response.status === 401 ? "Token was rejected." : `HTTP ${response.status}`);
        const catalog = await response.json();
        records = catalog.profiles;
        searchInput.hidden = false;
        statusNode.textContent = `Catalog revision ${catalog.revision} · ${records.filter(item => !item.deleted).length} profiles`;
        render();
        tokenInput.value = "";
      } catch (error) {
        statusNode.textContent = error.message || "Library could not be reached.";
      } finally {
        loadButton.disabled = false;
      }
    });
    searchInput.addEventListener("input", render);
  </script>
</body>
</html>
