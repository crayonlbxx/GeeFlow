# Include inside the hostinghk HTTPS origin server block.
location = /profile-library/api/v1/catalog {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8093/profile-library/api/v1/catalog;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 25s;
}

location = /profile-library/api/v1/health {
    proxy_pass http://127.0.0.1:8093/profile-library/api/v1/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 5s;
}

location ^~ /profile-library/ {
    root /var/www/hk-site;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
